apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-updater
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-monitor-binding
subjects:
- kind: ServiceAccount
  name: registry-monitor
roleRef:
  kind: Role
  name: deployment-updater
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-monitor
  template:
    metadata:
      labels:
        app: registry-monitor
    spec:
      serviceAccountName: registry-monitor
      containers:
      - name: monitor
        image: registry.dev.svc.cluster.local:5000/registry-monitor:v1
        imagePullPolicy: Always
      imagePullSecrets:
      - name: regcred
